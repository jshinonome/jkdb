[package]
name = "jkdb"
version = "2.0.0"
edition = "2024"
description = "JavaScript/WASM interface for kdb+/q"
license = "Apache-2.0"
repository = "https://github.com/jshinonome/jkdb"

[lib]
crate-type = ["cdylib", "rlib"]
path = "rust/lib.rs"

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
hex = "0.4"

[dev-dependencies]
wasm-bindgen-test = "0.3"
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
